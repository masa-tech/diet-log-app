<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>diet-log 体重と食事</title>
<meta name="theme-color" content="#15803d" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1114" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="diet-log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root {
  color-scheme: light dark;
  --bg: #f3f5f7; --card: #ffffff; --text: #1c2127; --muted: #5d6875; --line: #dde2e8; --soft: #eef1f4;
  --accent: #15803d; --accent-ink: #ffffff; --accent-soft: #e3f5e9;
  --danger: #c62828; --warn-bg: #fff4d6; --warn-ink: #7a4d00;
  --p: #e8603c; --f: #c99100; --c: #2f74d0; --track: #e6eaee; --over: #c62828;
  --shadow: 0 1px 2px rgba(0,0,0,.06); --in-ink: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1114; --card: #181d22; --text: #e7ebef; --muted: #9ba6b2; --line: #2b333b; --soft: #20262c;
    --accent: #4ade80; --accent-ink: #06210f; --accent-soft: #16301f;
    --danger: #ff6b6b; --warn-bg: #3a2c0c; --warn-ink: #ffd98a;
    --p: #ff8a65; --f: #ffd54f; --c: #64a8ff; --track: #262e36; --over: #ff6b6b;
    --shadow: none; --in-ink: #10151a;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
  font-size: 16px; line-height: 1.5;
}
body.noscroll { overflow: hidden; }
main { max-width: 520px; margin: 0 auto; padding: 0 10px calc(90px + env(safe-area-inset-bottom)); }
main.has-fab { padding-bottom: calc(150px + env(safe-area-inset-bottom)); }
h1, h2, h3 { margin: 0; line-height: 1.3; }
h2.view-title { font-size: 20px; padding: 14px 2px 8px; }
h3 { font-size: 16px; }
button, input, select { font: inherit; color: inherit; }
button {
  cursor: pointer; min-height: 44px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); padding: 0 14px; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
button:disabled { opacity: .45; cursor: default; }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 700; }
.btn-danger { color: var(--danger); border-color: currentColor; background: transparent; }
.btn-block { display: block; width: 100%; }
.btn-link { border: 0; background: transparent; color: var(--accent); padding: 0 6px; }
input, select {
  min-height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--card);
  padding: 0 10px; width: 100%; min-width: 0;
}
input::placeholder { color: var(--muted); opacity: .8; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin: 10px 0; box-shadow: var(--shadow); }
.card > h3 { margin-bottom: 8px; }
.est {
  display: inline-block; font-style: normal; font-size: 10px; line-height: 1; padding: 2px 3px; margin-left: 3px;
  border-radius: 4px; border: 1px solid var(--muted); color: var(--muted); vertical-align: 2px; font-weight: 400;
}
.banner { position: sticky; top: 0; z-index: 30; max-width: 520px; margin: 0 auto; padding: 6px 10px 2px; background: var(--bg); }
.banner p { margin: 0 0 4px; padding: 8px 12px; border-radius: 10px; background: var(--warn-bg); color: var(--warn-ink); font-size: 14px; }

/* 下のタブ */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center;
  background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
}
.tabbar .tabs { display: flex; width: 100%; max-width: 520px; }
.tabbar button {
  flex: 1; border: 0; border-radius: 0; background: transparent; min-height: 58px; padding: 4px 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; color: var(--muted);
}
.tabbar button[aria-current="page"] { color: var(--accent); font-weight: 700; }
.tabbar svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.fab {
  position: fixed; z-index: 15; right: max(14px, calc(50% - 246px)); bottom: calc(70px + env(safe-area-inset-bottom));
  min-height: 52px; border-radius: 26px; padding: 0 22px; font-size: 17px; box-shadow: 0 4px 14px rgba(0,0,0,.25);
}

/* 記録 */
.datebar { position: sticky; top: var(--banner-h, 0px); z-index: 10; background: var(--bg); display: flex; align-items: center; gap: 6px; padding: 8px 0 4px; }
.datebar .nav { padding: 0 10px; font-size: 14px; white-space: nowrap; }
.datepick { flex: 1; position: relative; min-width: 0; }
.datepick .label { display: flex; align-items: center; justify-content: center; min-height: 44px; font-weight: 700; font-size: 17px; white-space: nowrap; border-radius: 10px; }
.datepick input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; padding: 0; border: 0; cursor: pointer; }
#btn-today { padding: 0 10px; font-size: 14px; }
.sync-line { margin: 0 2px; font-size: 12px; color: var(--muted); text-align: right; }
.sync-line.is-bad { color: var(--danger); font-weight: 700; }
.sum-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.sum-top .big { font-size: 30px; font-weight: 800; }
.sum-remain { font-size: 15px; }
.sum-remain b { font-size: 18px; }
.over { color: var(--over); }
.bar { height: 10px; border-radius: 5px; background: var(--track); overflow: hidden; margin: 6px 0 10px; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 5px; }
.bar i.is-over { background: var(--over); }
.pfc-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pfc-grid .k { font-size: 12px; color: var(--muted); }
.pfc-grid .v { font-size: 15px; font-weight: 700; }
.pfc-grid .bar { height: 6px; margin: 3px 0 2px; }
.pfc-grid .r { font-size: 12px; }
.bar.p i { background: var(--p); } .bar.f i { background: var(--f); } .bar.c i { background: var(--c); }
.meal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.meal-head h3 { flex: 0 0 auto; }
.meal-head .mk { flex: 1; color: var(--muted); font-size: 14px; }
.meal-head button { padding: 0 12px; font-size: 14px; }
.empty { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
table.rec { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 13px; font-variant-numeric: tabular-nums; }
table.rec col.c-cnt { width: 34px; } table.rec col.c-g { width: 40px; } table.rec col.c-k { width: 40px; } table.rec col.c-n { width: 34px; }
table.rec th { font-size: 11px; color: var(--muted); font-weight: 600; padding: 2px 2px 4px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.rec td { padding: 5px 2px; text-align: right; border-bottom: 1px solid var(--line); height: 46px; vertical-align: middle; }
table.rec th:first-child, table.rec td:first-child { text-align: left; padding-left: 0; }
table.rec tbody tr { cursor: pointer; }
table.rec tbody tr:active, table.rec tbody tr:hover { background: var(--soft); }
table.rec .nm { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; line-height: 1.3; }
table.rec tfoot td { font-weight: 700; border-bottom: 0; height: 36px; }
.weight-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.field { display: block; }
.field > span:not(.unit-input) { display: block; font-size: 13px; color: var(--muted); margin-bottom: 2px; }
.unit-input { display: flex; align-items: center; gap: 6px; }
.unit-input input { text-align: right; }
.unit-input em { font-style: normal; color: var(--muted); font-size: 14px; }
.row-actions { display: flex; gap: 8px; margin-top: 10px; }
.row-actions > * { flex: 1; }

/* シート（食品を選ぶ・量を入れる・食品を足す） */
.sheet-wrap { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.45); }
.sheet {
  position: relative; width: 100%; max-width: 520px; max-height: 92vh; max-height: 92dvh; display: flex; flex-direction: column;
  background: var(--card); border-radius: 16px 16px 0 0; padding-bottom: env(safe-area-inset-bottom);
}
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 14px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { flex: 1; font-size: 17px; min-width: 0; overflow-wrap: anywhere; }
.sheet-head h2:focus { outline: none; }
.sheet-head button { border: 0; font-size: 22px; width: 44px; padding: 0; background: transparent; }
.sheet-body { overflow-y: auto; overscroll-behavior: contain; padding: 10px 14px 16px; -webkit-overflow-scrolling: touch; }
.seg { display: flex; gap: 4px; background: var(--soft); padding: 3px; border-radius: 12px; margin-bottom: 10px; }
.seg button { flex: 1; border: 0; background: transparent; padding: 0 2px; font-size: 14px; min-width: 0; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--accent); font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0; margin: 0 -14px; padding-left: 14px; padding-right: 14px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: 0 0 auto; border-radius: 22px; font-size: 14px; padding: 0 14px; }
.chips button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 700; }
.food-list { display: flex; flex-direction: column; gap: 6px; margin: 4px 0 10px; }
.food-item { text-align: left; padding: 8px 12px; min-height: 56px; display: block; width: 100%; }
.food-item .fn { display: block; font-weight: 600; overflow-wrap: anywhere; }
.food-item .fs { display: block; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.list-note { color: var(--muted); font-size: 14px; padding: 8px 2px; margin: 0; }
.am-food { margin-bottom: 10px; }
.am-food .an { font-size: 18px; font-weight: 700; overflow-wrap: anywhere; }
.am-row { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
.am-row .lb { width: 40px; flex: 0 0 auto; color: var(--muted); font-size: 14px; }
.am-row input { text-align: center; font-size: 20px; font-weight: 700; flex: 1; }
.am-row .u { width: 44px; flex: 0 0 auto; color: var(--muted); font-size: 14px; }
.round { width: 52px; min-height: 52px; flex: 0 0 auto; font-size: 24px; padding: 0; border-radius: 26px; }
.am-preview { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--soft); border-radius: 12px; padding: 10px 6px; text-align: center; margin: 12px 0; }
.am-preview .k { font-size: 12px; color: var(--muted); }
.am-preview .v { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
.am-preview .msg { grid-column: 1 / -1; color: var(--danger); font-size: 14px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
.form-grid .wide { grid-column: 1 / -1; }
.form-msg { color: var(--danger); font-size: 14px; min-height: 1.5em; margin: 6px 0 0; }

/* 設定 */
.pfc-inputs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.target-g { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; background: var(--soft); border-radius: 10px; padding: 8px; text-align: center; }
.target-g .k { font-size: 12px; color: var(--muted); }
.target-g .v { font-weight: 700; font-variant-numeric: tabular-nums; }
.sum-line { font-size: 14px; margin: 6px 0 0; }
.food-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.food-row:last-child { border-bottom: 0; }
.food-row .info { flex: 1; min-width: 0; }
.food-row .fn { display: block; overflow-wrap: anywhere; font-size: 15px; }
.food-row .fs { display: block; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.food-row button { flex: 0 0 auto; padding: 0 12px; font-size: 14px; }
details.master > summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; color: var(--accent); font-weight: 600; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.file-btn { position: relative; display: flex; align-items: center; justify-content: center; min-height: 44px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.file-btn:focus-within { outline: 3px solid var(--accent); }

/* ダッシュボード */
.period { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.period .pl { flex: 1; text-align: center; font-weight: 700; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.period button { padding: 0 12px; }
svg.chart { display: block; width: 100%; height: auto; overflow: visible; }
svg.chart text { fill: var(--text); font-size: 11px; font-family: inherit; }
svg.chart text.mut { fill: var(--muted); }
svg.chart text.in { fill: var(--in-ink); font-weight: 700; }
svg.chart text.tiny { font-size: 9px; }
svg.chart .track { fill: var(--track); }
svg.chart .grid { stroke: var(--line); stroke-width: 1; }
svg.chart .tline { stroke: var(--text); stroke-width: 2; stroke-dasharray: 4 3; }
svg.chart .b-k { fill: var(--accent); } svg.chart .b-p { fill: var(--p); } svg.chart .b-f { fill: var(--f); } svg.chart .b-c { fill: var(--c); }
svg.chart .b-over { fill: var(--over); }
svg.chart .w-line { fill: none; stroke: var(--muted); stroke-width: 1.5; }
svg.chart .w-pt { fill: var(--c); }
svg.chart .ma { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
.legend i.l-dash { height: 0; border-top: 2px dashed var(--text); border-radius: 0; vertical-align: 3px; }
.legend i.l-ma { height: 0; border-top: 3px solid var(--accent); border-radius: 0; vertical-align: 3px; }
.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.stat { background: var(--soft); border-radius: 10px; padding: 8px 10px; }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .v { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
.stat .t { font-size: 12px; color: var(--muted); }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(132px + env(safe-area-inset-bottom)); z-index: 60;
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 22px; font-size: 14px; max-width: 90vw; pointer-events: none;
}
.toast.is-error { background: var(--danger); color: #fff; border-radius: 12px; font-weight: 700; }
</style>
</head>
<body>
<div id="banner" class="banner" role="status" hidden></div>

<main id="main">
  <!-- 記録 -->
  <section id="view-record" class="view" aria-label="記録">
    <div class="datebar">
      <button type="button" class="nav" data-action="prev-day" aria-label="前日">‹ 前日</button>
      <div class="datepick">
        <span class="label" id="date-label"></span>
        <input type="date" id="date-input" aria-label="日付を選ぶ">
      </div>
      <button type="button" class="nav" data-action="next-day" aria-label="翌日">翌日 ›</button>
      <button type="button" id="btn-today" data-action="today">今日</button>
    </div>
    <p id="sync-line" class="sync-line" role="status" hidden></p>
    <div id="summary" class="card"></div>
    <div id="meals"></div>
    <div id="weight-card" class="card"></div>
  </section>

  <!-- ダッシュボード -->
  <section id="view-dash" class="view" aria-label="ダッシュボード" hidden>
    <h2 class="view-title">ダッシュボード</h2>
    <div class="seg" id="dash-seg">
      <button type="button" data-action="dash-mode" data-mode="day">日</button>
      <button type="button" data-action="dash-mode" data-mode="week">週</button>
      <button type="button" data-action="dash-mode" data-mode="month">月</button>
    </div>
    <div class="period">
      <button type="button" data-action="dash-prev" aria-label="前へ">‹</button>
      <div class="pl" id="dash-label"></div>
      <button type="button" data-action="dash-next" aria-label="次へ">›</button>
      <button type="button" data-action="dash-today">今日</button>
    </div>
    <div id="dash-body"></div>
  </section>

  <!-- 設定 -->
  <section id="view-settings" class="view" aria-label="設定" hidden>
    <h2 class="view-title">設定</h2>
    <div id="settings-body"></div>
  </section>
</main>

<button type="button" class="fab btn-primary" id="fab" data-action="add-auto">＋ 追加</button>

<nav class="tabbar" aria-label="画面の切り替え">
  <div class="tabs">
    <button type="button" data-action="tab" data-tab="record" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>記録</button>
    <button type="button" data-action="tab" data-tab="dash">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>ダッシュボード</button>
    <button type="button" data-action="tab" data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9 7 7M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>設定</button>
  </div>
</nav>

<div id="sheet" class="sheet-wrap" hidden>
  <div class="sheet-backdrop" data-action="close-sheet"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <h2 id="sheet-title" tabindex="-1"></h2>
      <button type="button" data-action="close-sheet" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="foods.js"></script>
<script>
(function () {
  'use strict';

  // ===== 定数 =====
  // 保存のキーと版の決まり:
  //   - 記録は localStorage のキー STORE_KEY（'dietlog.v1'）に 1 つの JSON で入れる。中の version が SCHEMA_VERSION
  //   - 形を変えるときは SCHEMA_VERSION を上げ、migrate() に「古い版 → 新しい版」の移しかえを足す（キー名は変えない）
  //   - このアプリより新しい版のデータを見つけたら、読まずに・書かずに「アプリを更新してください」と出す
  //   - 退避用のキー: STORE_KEY + '.broken-<時刻>'（読めなかったデータ）、'.pre-import-<時刻>'（読み込みで置き換える前のデータ。
  //     最新の 3 つ）、'.dropped-<時刻>'（読めない記録が混じっていたときの元のデータ。最新の 1 つ）
  //   - スプレッドシートとの同期の設定（URL・合言葉・最後に同期した時刻）は STORE_KEY + '.sync' に別に置く（書き出す JSON には入れない）
  var SCHEMA_VERSION = 1;
  var STORE_KEY = 'dietlog.v1';
  var SYNC_KEY = STORE_KEY + '.sync';
  var MEALS = [
    { id: 'breakfast', label: '朝食', short: '朝' },
    { id: 'lunch', label: '昼食', short: '昼' },
    { id: 'dinner', label: '夕食', short: '夕' },
    { id: 'snack', label: '間食', short: '間食' },
    { id: 'late', label: '夜食', short: '夜食' }
  ];
  var MEAL_IDS = MEALS.map(function (m) { return m.id; });
  var CATS = ['主食', '肉魚', '乳製品', '惣菜', '飲み物', '菓子', 'その他'];
  // 最初の目標は一般的な値。自分の目標は 設定 で入れる（過去の記録のファイルに目標が入っていれば、設定を変える前なら取り込む）

        return { ok: false, error: 'storage', detail: 'この端末に設定を保存できませんでした' };
      }
      if (!prev || prev.url !== url) { markAllDirty(); persist(); }   // 初めてつなぐシートには手元の記録を全部送る
      return syncNow({ full: true }).then(function (r) {
        return { ok: r.ok, error: r.error, detail: r.detail, remote: { entries: cnt(d.entries), weights: cnt(d.weights), foods: cnt(d.foods) } };
      });

  // ===== バックアップから戻す（スプレッドシートにつないでいるとき） =====
  // バックアップの項目を今の時刻で記録し直して、シートと各端末の同じ項目を上書きする。
  // deleteOthers: バックアップに無い項目を、シートと各端末からも消す
  function planRestore(imp) {
    var plan = { imp: imp, others: {} };
    SYNC_KINDS.forEach(function (d) {
      var inBackup = new Set(imp.state[d.kind].map(d.key));
      plan.others[d.kind] = state[d.kind].filter(function (x) { return !inBackup.has(d.key(x)); }).map(d.key);
    });
    plan.otherRecords = plan.others.entries.length + plan.others.weights.length;
    plan.otherFoods = plan.others.userFoods.length;
    return plan;
  }
  function applyRestore(plan, opts) {
    opts = opts || {};
    if (writeBlock === 'newer') return { ok: false, error: '新しい版のアプリで保存されたデータがあります。アプリを更新してください' };
    if (hasData() && !store.keep('pre-import', exportJSON(), 3) && !opts.allowNoBackup) return { ok: false, needConfirmNoBackup: true };
    var imp = plan.imp, removed = 0;
    SYNC_KINDS.forEach(function (d) {
      var byKey = new Map(), tombs = normTombs(state.meta.deleted[d.kind]);
      state[d.kind].forEach(function (x) { byKey.set(d.key(x), x); });
      imp.state[d.kind].forEach(function (x) {
        var k = d.key(x), cur = byKey.get(k);
        delete x._noId;
        x.updatedAt = nextStamp(cur && stampOf(cur), tombs.get(k));
        byKey.set(k, x);
        tombs.delete(k);
        markDirty(d.kind, k, x.updatedAt);
      });
      if (d.kind === 'userFoods' ? opts.deleteFoods : opts.deleteOthers) {
        plan.others[d.kind].forEach(function (k) {
          var at = nextStamp(stampOf(byKey.get(k)), tombs.get(k));
          byKey.delete(k); tombs.set(k, at); markDirty(d.kind, k, at); removed++;
        });
      }
      var list = Array.from(byKey.values());
      state[d.kind] = d.kind === 'weights' ? list.sort(byDate) : list;
      state.meta.deleted[d.kind] = tombList(tombs);
    });
    if (imp.hasSettings) {
      state.settings = imp.state.settings;
      state.meta.settingsUpdatedAt = nextStamp(state.meta.settingsUpdatedAt);
      markDirty('settings', '', state.meta.settingsUpdatedAt);
    }
    var ok = persist();
    return { ok: true, saved: ok, entries: imp.counts.entries, weights: imp.counts.weights, removed: removed };
  }
  function restoreMessage(imp) {
    return 'バックアップから戻します（食事 ' + imp.counts.entries + ' 件・体重 ' + imp.counts.weights + ' 件・食品 ' + imp.counts.userFoods + ' 件・読めなかった ' + imp.dropped + ' 件）。\n' +
      'スプレッドシートにつないでいるので、バックアップの記録を今の時刻で記録し直して、シートとすべての端末の同じ記録を上書きします。\n' +
      '今のデータは控えとして端末内に残します（設定 →「読み込む前のデータを書き出す」）。よろしいですか？';

  // 「初期の食品をシートへ送る」: data/foods-initial.json（公開しない）を選んで、まだ無い食品だけ足す
  function parseFoodsFile(text) {
    var obj;
    try { obj = JSON.parse(text); } catch (e) { return { ok: false, error: 'JSON として読めませんでした' }; }
    if (!obj || typeof obj !== 'object' || obj.app !== 'diet-log' || !Array.isArray(obj.foods)) {
      return { ok: false, error: 'diet-log の食品のファイル（foods-initial.json）ではないので読み込みませんでした' };
    }
    var have = new Set(state.userFoods.map(function (f) { return f.id; })), tombs = normTombs(state.meta.deleted.userFoods);
    var add = [], skipped = 0, bad = 0, seen = new Set();
    obj.foods.forEach(function (raw) {
      var f = normFood(raw);
      if (!f) { bad++; return; }
      if (have.has(f.id) || tombs.has(f.id) || seen.has(f.id)) { skipped++; return; }
      seen.add(f.id);
      add.push(f);
    });
    return { ok: true, add: add, skipped: skipped, bad: bad };
  }
  function applyFoods(plan) {
    var now = nowIso();
    plan.add.forEach(function (f) { f.updatedAt = now; state.userFoods.push(f); markDirty('userFoods', f.id, now); });
    var ok = persist();
    return { ok: true, saved: ok, added: plan.add.length, skipped: plan.skipped, bad: plan.bad };
  }

    if (c < 0.5) c = 0.5;

    s.grams = s.per.g ? r1(c * s.per.g) : null;

  function download(name, text, mime) {

      var list = sheetFocusables();
      if (!list.length) return;
      var first = list[0], last = list[list.length - 1], a = document.activeElement;
      var inside = a && a.closest && a.closest('#sheet .sheet');
      if (ev.shiftKey && (a === first || !inside || a === $('#sheet-title'))) { ev.preventDefault(); last.focus(); }
      else if (!ev.shiftKey && (a === last || !inside)) { ev.preventDefault(); first.focus(); }
      return;
    }
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('tr[data-action="edit"]')) {
      ev.preventDefault();
      openAmountEdit(ev.target.getAttribute('data-id'));
    }
  });
  document.addEventListener('input', function (ev) {
    var id = ev.target.id;
    if (id === 'pk-q') { sheet.q = ev.target.value; $('#pk-list').innerHTML = pickerListHtml(); }
    else if (id === 'am-count') {
      var c = num(ev.target.value);
      sheet.factor = c;
      sheet.byGrams = false;
      sheet.thousands = hasThousands(ev.target.value);
      if (c > 0 && sheet.per.g) { sheet.grams = r1(r2(c) * sheet.per.g); $('#am-grams').value = fmtPlain(sheet.grams); }
      updatePreview();
    } else if (id === 'am-grams') {
      var g = num(ev.target.value);
      sheet.grams = g;
      sheet.byGrams = true;
      sheet.thousands = hasThousands(ev.target.value);
      sheet.factor = g > 0 ? g / sheet.per.g : NaN;
      if (g > 0) $('#am-count').value = fmtPlain(sheet.factor);
      updatePreview();
    } else if (id && id.indexOf('ff-') === 0) { updateFoodCalc(); $('#ff-msg').textContent = ''; }
    else if (id && id.indexOf('w-') === 0) { var wm = $('#w-msg'); if (wm) wm.textContent = ''; }
    else if (id && id.indexOf('st-') === 0) updateSettingsPreview();
  });
  document.addEventListener('toggle', function (ev) {
    if (ev.target && ev.target.id === 'st-food-list') ui.foodsOpen = ev.target.open;
  }, true);
  document.addEventListener('change', function (ev) {
    if (ev.target.id === 'date-input' && isYmd(ev.target.value)) { ui.date = ev.target.value; renderRecord(); }
    if (ev.target.id === 'import-file') readChosenFile(ev.target, importReplaceUI);
    if (ev.target.id === 'import-past') readChosenFile(ev.target, importMergeUI);
    if (ev.target.id === 'import-foods') readChosenFile(ev.target, importFoodsUI);
  });
  $('#date-input').addEventListener('click', function () {
    try { if (this.showPicker) this.showPicker(); } catch (e) { /* 対応しない環境では普通に開く */ }
  });

  // ほかの画面（ホーム画面のアプリとタブなど）が保存したら、読み直して描き直す
  function reloadFromStorage() {
    loadState();
    renderBanner();
    if (sheet && sheet.kind === 'amount' && sheet.mode === 'edit' && !state.entries.some(function (e) { return e.id === sheet.id; })) {
      closeSheet();
      toast('この記録は別の画面で消されました');
    }
    var a = document.activeElement, typing = a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName);
    if (ui.tab === 'settings') { if (!(typing && a.closest('#settings-body'))) renderSettings(); }
    else if (ui.tab === 'record') renderRecord(typing && !!a.closest('#weight-card'));
    else renderDash();
  }
  window.addEventListener('storage', function (ev) {
    if (ev.key !== null && ev.key !== STORE_KEY) return;
    reloadFromStorage();
  });
  // 画面に戻ったとき: ほかの画面の保存を読み直し（止まっていた画面を新しくする）、日付の変わり目を確かめ、同期する
  function onResume() {
    if (store.ok && !writeBlock) reloadFromStorage();
    checkDayChange();
    if (loadSyncCfg()) syncNow();
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) onResume(); });
  window.addEventListener('pageshow', function (ev) { if (ev.persisted) onResume(); });
  window.addEventListener('focus', checkDayChange);
  window.addEventListener('online', function () { if (loadSyncCfg()) syncNow(); });
  // 1 分ごと: 日付の変わり目。送信待ちがあれば送る。5 分ごとにシートを読み直す
  var lastPullTick = Date.now();
  setInterval(function () {
    checkDayChange();
    if (document.hidden || !loadSyncCfg() || sync.busy) return;
    if (pendingCount() - heldCount() > 0 || Date.now() - lastPullTick > 5 * 60000) { lastPullTick = Date.now(); syncNow(); }   // 受け付けられなかった分は数えない
  }, 60000);
  // Android の「戻る」でシートを閉じる
  window.addEventListener('popstate', function () {
    if (ignorePop) { ignorePop = false; return; }
    if (!$('#sheet').hidden) { sheetHistory = false; closeSheet(true); }
  });

  // ===== テスト・確認用の窓口 =====
  window.dietAPI = {
    schemaVersion: SCHEMA_VERSION,
    storageKey: STORE_KEY,
    storageOk: function () { return store.ok; },
    lastSave: function () { return clone(lastSave); },
    getState: function () { return clone(state); },
    foods: function () { return clone(allFoods()); },
    today: todayStr,
    getDate: function () { return ui.date; },
    setDate: function (d) { if (isYmd(d)) { ui.date = d; if (ui.tab === 'record') renderRecord(); } return ui.date; },
    checkDayChange: checkDayChange,
    go: go,
    setDash: function (mode, date) {
      if (['day', 'week', 'month'].indexOf(mode) >= 0) ui.dashMode = mode;
      if (isYmd(date)) ui.dashDate = date;
      if (ui.tab === 'dash') renderDash();
    },
    addEntry: function (o) { var e = addEntry(o || {}); render(); return e; },
    updateEntry: function (id, o) { var e = updateEntry(id, o || {}); render(); return e; },
    deleteEntry: function (id) { var r = deleteEntry(id); render(); return r; },
    setWeight: function (date, kg, fat, memo) { var w = setWeight(date, kg, fat, memo); render(); return w; },
    deleteWeight: function (date) { deleteWeight(date); render(); },
    setSettings: function (o) { var r = setSettings(o || {}); render(); return r; },
    addUserFood: function (o) { var r = saveUserFood(o || {}); render(); return r; },
    deleteUserFood: function (id) { deleteUserFood(id); render(); },
    dayTotals: dayTotals,
    targets: function () { return targets(); },
    periodStats: periodStats,
    exportJSON: exportJSON,
    exportCSV: exportCSV,
    download: download,
    syncNow: function (o) { return syncNow(o); },
    clockOffset: function () { return clockOffset; },
    connectSync: connectSync,
    disconnectSync: function () { disconnectSync(); render(); },
    syncConfig: function () { var c = loadSyncCfg(); return c ? { url: c.url, lastSyncAt: c.lastSyncAt || '' } : null; },
    syncStatus: function () { return { status: sync.status, text: syncStatusText(), pending: pendingCount(), held: heldCount(), busy: sync.busy }; },
    pendingCount: pendingCount,
    importFoods: function (text) { var plan = parseFoodsFile(text); if (!plan.ok) return plan; var r = applyFoods(plan); render(); return r; },
    // 確認なしの読み込み。mode: 'replace'（既定・置き換え）| 'merge'（無い記録だけ足す）
    importJSON: function (text, opts) {
      opts = opts || {};
      var imp = parseImport(text), r;
      if (!imp.ok) return { ok: false, error: imp.error };
      if (opts.mode === 'restore') {
        // バックアップから戻す（確認なし）。シートの全部を受け取ってから行うので Promise を返す
        return syncNow({ full: true }).then(function (sr) {
          if (!sr.ok) return { ok: false, error: 'offline' };
          var res = applyRestore(planRestore(imp), { deleteOthers: !!opts.deleteOthers, deleteFoods: !!opts.deleteFoods, allowNoBackup: !!opts.allowNoBackup });
          render();
          return res;
        });
      }
      if (opts.mode === 'merge') {
        var plan = planMerge(imp);
        r = plan.empty ? { ok: true, empty: true, entries: 0, weights: 0, skipped: plan.skipped } : applyMerge(plan);
      } else r = applyReplace(imp, { allowNoBackup: !!opts.allowNoBackup });
      render();
      return r;
    },
    reset: function () {
      store.clear();
      writeBlock = '';
      state = emptyState();
      state.meta.gen = uid('g');
      persist({ replace: true });
      render();
    }
  };

  // ===== 起動 =====
  (function () { var c = loadSyncCfg(); if (c) useClockOffset(c.clockSamples ? clockEstimate(c.clockSamples) : c.clockOffset); })();
  loadMaster();
  loadState();
  renderBanner();
  render();
  renderSyncStatus();
  if (loadSyncCfg()) syncNow();   // 開いたときにシートと合わせる
  // ホーム画面に追加するための manifest は http(s) で開いたときだけ付ける（file:// だとブラウザがエラーを出すため）
  if (location.protocol === 'http:' || location.protocol === 'https:') {
    var ml = document.createElement('link');
    ml.rel = 'manifest';
    ml.href = 'manifest.webmanifest';
    document.head.appendChild(ml);
  }
})();
</script>
</body>
</html>
